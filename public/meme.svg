<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="400" height="400" fill="#ffffff" />

  <!-- Bold Chinese Text: 惹不起，惹不起 -->
  <text x="200" y="65" text-anchor="middle" font-family="'SimHei', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="1">惹不起，惹不起</text>

  <!-- Panda Character Group -->
  <g id="panda-body" transform="translate(0, 20)">
    <!-- Left Black Ear -->
    <path d="M 68 128 C 45 105, 70 70, 95 85 C 115 98, 110 135, 88 140 Z" fill="#000000" />
    <!-- Right Black Ear -->
    <path d="M 332 128 C 355 105, 330 70, 305 85 C 285 98, 290 135, 312 140 Z" fill="#000000" />

    <!-- Black Shoulders and Body -->
    <path d="M 0 380 L 0 320 C 0 250, 45 190, 110 175 C 105 210, 115 320, 130 380 Z" fill="#000000" />
    <path d="M 400 380 L 400 320 C 400 250, 355 190, 290 175 C 295 210, 285 320, 270 380 Z" fill="#000000" />

    <!-- White Panda Head -->
    <path d="M 85 175 C 75 110, 135 90, 200 90 C 265 90, 325 110, 315 175 C 310 240, 265 285, 200 285 C 135 285, 90 240, 85 175 Z" 
          fill="#ffffff" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

    <!-- Clasped Begging/Pleading Hands in Front -->
    <!-- Solid Black Left Arm -->
    <path d="M 12 380 C 15 280, 80 210, 160 170 C 170 190, 175 220, 150 280 C 130 330, 90 380, 70 380 Z" fill="#000000" />
    <!-- Solid Black Right Arm and Forearms -->
    <path d="M 388 380 C 385 280, 320 210, 240 170 C 230 190, 225 220, 250 280 C 270 330, 310 380, 330 380 Z" fill="#000000" />
    
    <!-- Clasped Praying Hands Silhouette (covering chin/mouth) -->
    <path d="M 175 160 C 182 155, 192 165, 190 190 C 185 220, 160 270, 135 320 L 110 380 L 195 380 C 205 330, 215 260, 218 210 C 220 175, 210 155, 195 152 C 185 150, 178 155, 175 160 Z" fill="#000000" />
    <path d="M 190 162 C 196 156, 208 160, 206 185 C 200 220, 180 275, 170 320 L 160 380 L 220 380 C 235 320, 255 240, 250 195 C 245 160, 225 152, 205 156 Z" fill="#000000" />

    <!-- Human Meme Face (Classic Pitying/Pleading Expression) -->
    <g transform="translate(0, -10)">
      <!-- Left Eyebrow (slanted inward, pitiful) -->
      <path d="M 125 168 Q 148 152 172 172" stroke="#000000" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 130 163 Q 150 148 170 166" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" />

      <!-- Right Eyebrow (slanted inward, pitiful) -->
      <path d="M 228 172 Q 252 152 275 168" stroke="#000000" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 230 166 Q 250 148 270 163" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" />

      <!-- Left Eye (squinting downward with distress wrinkles) -->
      <path d="M 132 188 Q 152 178 168 192" stroke="#000000" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 135 193 Q 152 185 166 196" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none" />
      <circle cx="152" cy="187" r="3.5" fill="#000000" />
      <!-- Wrinkles around left eye -->
      <path d="M 126 184 L 120 182" stroke="#000000" stroke-width="2" />
      <path d="M 125 190 L 118 191" stroke="#000000" stroke-width="2" />
      <path d="M 127 196 L 122 199" stroke="#000000" stroke-width="2" />

      <!-- Right Eye (squinting downward) -->
      <path d="M 232 192 Q 248 178 268 188" stroke="#000000" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 234 196 Q 248 185 265 193" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none" />
      <circle cx="248" cy="187" r="3.5" fill="#000000" />
      <!-- Wrinkles around right eye -->
      <path d="M 274 184 L 280 182" stroke="#000000" stroke-width="2" />
      <path d="M 275 190 L 282 191" stroke="#000000" stroke-width="2" />
      <path d="M 273 196 L 278 199" stroke="#000000" stroke-width="2" />

      <!-- Nose Bridge & Nostrils -->
      <path d="M 197 195 Q 194 212 188 218 Q 197 222 205 218 Q 202 210 200 195" stroke="#000000" stroke-width="2.5" fill="#000000" />

      <!-- Cheek wrinkles -->
      <path d="M 136 205 Q 145 224 158 238" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 264 205 Q 255 224 242 238" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" />

      <!-- Apologetic Mouth / Sheepish Smile -->
      <path d="M 172 242 Q 200 252 228 242" stroke="#000000" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 180 246 Q 200 252 220 246" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>
  </g>
</svg>
